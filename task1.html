<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add new product</title>
</head>
<body>
  <h1>Add new product</h1>

  <form>
    <div>
      <label for="full-name">Full name:</label>
      <input type="text" id="full-name" name="full_name" placeholder="e.g. John Kowalski" minlength="2" maxlength="50" required>
    </div>

    <div>
      <label for="email-address">Email address:</label>
      <input type="email" id="email-address" name="email_address" placeholder="e.g. kowalski@example.com" minlength="5" maxlength="80" size="30" required>
    </div>

    <div>
      <label for="phone-number">Phone number:</label>
      <input type="tel" id="phone-number" name="phone_number" placeholder="+48 123 456 789" minlength="15" maxlength="15" pattern="\+48 [0-9]{3} [0-9]{3} [0-9]{3}" title="Format: +48 123 456 789">
    </div>

    <div>
      <input type="checkbox" id="create-account" name="create_account">
      <label for="create-account">Create an account</label>
    </div>

    <div>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Min. 8 characters" minlength="8" maxlength="30" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$" title="At least 8 characters, including a lowercase letter, an uppercase letter and a digit">
    </div>

    <div>
      <label for="product-type">Product type:</label>
      <select id="product-type" name="product_type" size="1" required>
        <option value="">— choose —</option>
        <optgroup label="Electronics">
          <option value="phone">Phone</option>
          <option value="laptop">Laptop</option>
        </optgroup>
        <optgroup label="Fashion">
          <option value="clothing">Clothing</option>
          <option value="footwear">Footwear</option>
        </optgroup>
      </select>
    </div>

    <div>
      <label for="price">Price:</label>
      <input type="range" id="price" name="price" min="0" max="1000" step="10" value="500" oninput="priceOutput.value = this.value">
      <output id="priceOutput" for="price">500</output>
    </div>

    <div>
      <label for="description">Description:</label>
      <textarea id="description" name="description" rows="4" cols="40" placeholder="Short product description..." minlength="10" maxlength="300"></textarea>
    </div>

    <div>
      <label for="maker">Maker:</label>
      <input type="text" id="maker" name="maker" list="makers" placeholder="e.g. Apple" maxlength="40">
      <datalist id="makers">
        <option value="Apple">
        <option value="Samsung">
      </datalist>
    </div>

    <div>
      <span>Warranty period:</span>
      <input type="radio" id="warranty-12" name="warranty_period" value="12">
      <label for="warranty-12">12 months</label>
      <input type="radio" id="warranty-24" name="warranty_period" value="24">
      <label for="warranty-24">24 months</label>
    </div>

    <div>
      <label for="product-photo">Product photo:</label>
      <input type="file" id="product-photo" name="product_photo" accept="image/*">
    </div>

    <div>
      <label for="purchase-date">Purchased date:</label>
      <input type="date" id="purchase-date" name="purchase_date" min="2020-01-01" max="2026-10-12">
    </div>

    <div>
      <label for="tags">Tags:</label>
      <select id="tags" name="tags" multiple size="3">
        <option value="new">New</option>
        <option value="used">Used</option>
        <option value="popular">Popular</option>
      </select>
    </div>

    <div>
      <button type="reset">Reset</button>
      <button type="submit">Submit</button>
      <button type="button">Save draft</button>
    </div>
  </form>
</body>
</html>
